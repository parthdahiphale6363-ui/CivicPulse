services:
  - type: web
    name: civicpulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: RAG_ENABLED
        value: "1"
      - key: RAG_BACKEND
        value: "sql"
      - key: SUPABASE_DB_URL
        sync: false
